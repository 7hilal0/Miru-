name: Import upstream Miru source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Import upstream Miru source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import official Miru repository into this repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --branch dev --single-branch https://github.com/miru-project/miru-app.git upstream
          cp "$GITHUB_WORKSPACE/.github/workflows/import-miru.yml" /tmp/import-miru.yml
          # Squash to a single import commit so the automatic token does not need
          # permission to replay upstream workflow-file history.
          rm -rf upstream/.git upstream/.github/workflows
          mkdir -p upstream/.github/workflows
          cp /tmp/import-miru.yml upstream/.github/workflows/import-miru.yml
          cd upstream
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git update-index --add --cacheinfo 160000,a6f7cea6b0a99c1c1fd289ab569dda3e6b6780bb,.isar
          git commit -m "Import Miru upstream source"
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force target HEAD:main
